apply plugin: 'com.android.application'

android {
    compileSdkVersion 33
    buildToolsVersion "33.0.2"

    defaultConfig {
        applicationId "com.taruna.grid"
        minSdkVersion 21
        targetSdkVersion 33
        versionCode 3
        versionName "3.0-grid-anti-mati"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    // Biar bisa di build di AIDE tanpa gradle wrapper ribet
    lintOptions { abortOnError false }
}

dependencies {
    // NO LIBRARY - FULL MANUAL CH340
    // Semua pakai android.hardware.usb bawaan
}
